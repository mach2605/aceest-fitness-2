<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logged Workouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Logged Workouts</h1>

      {% if not workouts %}
        <div class="alert alert-info">No workouts logged yet.</div>
      {% else %}
        <ul class="list-group">
          {% for w in workouts %}
            <li class="list-group-item">{{ loop.index }}. {{ w.workout if w.workout is defined else w['workout'] }} - {{ w.duration if w.duration is defined else w['duration'] }} minutes</li>
          {% endfor %}
        </ul>
      {% endif %}

      <a class="btn btn-link mt-4" href="{{ url_for('index') }}">Back</a>
    </div>
  </body>
</html>
