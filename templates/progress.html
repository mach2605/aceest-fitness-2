<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">📈 Personal Progress Tracker</h1>
      <div class="row">
        <div class="col-md-6">
          <canvas id="barChart"></canvas>
        </div>
        <div class="col-md-6">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
      <a class="btn btn-link mt-4" href="{{ url_for('index') }}">Back</a>
    </div>

    <script>
      async function fetchProgress(){
        const res = await fetch('/api/progress');
        const data = await res.json();
        const labels = Object.keys(data.totals);
        const values = Object.values(data.totals);
        const ctxB = document.getElementById('barChart').getContext('2d');
        const ctxP = document.getElementById('pieChart').getContext('2d');
        new Chart(ctxB, {type:'bar', data:{labels:labels, datasets:[{label:'Minutes', data:values}]}});
        new Chart(ctxP, {type:'pie', data:{labels:labels, datasets:[{data:values}]}});
      }
      fetchProgress();
    </script>
  </body>
</html>
