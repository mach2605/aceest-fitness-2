<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">User Info</h1>
      <form method="post" action="{{ url_for('user_info') }}">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="name">Name</label>
            <input id="name" name="name" class="form-control" value="{{ user.name if user and user.name is defined else '' }}">
          </div>
          <div class="form-group col-md-6">
            <label for="regn">Regn-ID</label>
            <input id="regn" name="regn" class="form-control" value="{{ user.regn_id if user and user.regn_id is defined else '' }}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="age">Age</label>
            <input id="age" name="age" class="form-control" value="{{ user.age if user and user.age is defined else '' }}">
          </div>
          <div class="form-group col-md-3">
            <label for="gender">Gender</label>
            <input id="gender" name="gender" class="form-control" value="{{ user.gender if user and user.gender is defined else '' }}">
          </div>
          <div class="form-group col-md-3">
            <label for="height">Height (cm)</label>
            <input id="height" name="height" class="form-control" value="{{ user.height if user and user.height is defined else '' }}">
          </div>
          <div class="form-group col-md-3">
            <label for="weight">Weight (kg)</label>
            <input id="weight" name="weight" class="form-control" value="{{ user.weight if user and user.weight is defined else '' }}">
          </div>
        </div>
        <button class="btn btn-primary">Save Info</button>
      </form>
      <a class="btn btn-link mt-3" href="{{ url_for('index') }}">Back</a>
    </div>
  </body>
</html>
