<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workout Charts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">🏋️ Personalized Workout Chart</h1>

      {% for category, exercises in charts.items() %}
        <h3 class="text-primary">{{ category }} Exercises</h3>
        <ul class="list-group mb-3">
          {% for ex in exercises %}
            <li class="list-group-item">• {{ ex }}</li>
          {% endfor %}
        </ul>
      {% endfor %}

      <a href="{{ url_for('index') }}" class="btn btn-link mt-4">← Back</a>
    </div>
  </body>
</html>
